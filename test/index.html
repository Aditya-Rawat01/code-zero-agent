<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Daily Journal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>My Daily Journal</h1>
        <div class="journal-input">
            <textarea id="journalEntry" placeholder="What's on your mind today?">
            </textarea>
            <button id="addEntryBtn">Add Entry</button>
        </div>
        <div class="journal-entries" id="journalEntries">
            <!-- Journal entries will be loaded here -->
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
